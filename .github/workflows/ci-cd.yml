name: CI/CD Spring Boot Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run unit tests
        run: mvn test -DskipITs=true

      - name: Wait for MySQL
        run: |
          curl -O https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh
          chmod +x wait-for-it.sh
          ./wait-for-it.sh localhost:3306 --timeout=60 --strict -- echo "MySQL est prêt"

      - name: Run integration tests
        run: mvn verify -DskipTests=false

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn 
          -B sonar:sonar 
          -Dsonar.projectKey=GooDSpeeD57_SquatRbNb 
          -Dsonar.organization=goodspeed57 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} 
          -Dsonar.branch.name=${{ github.ref_name }}

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squartrbnb.jar
          path: target/*.jar
          retention-days: 1

      - name: Notify Teams
        if: always()
        uses: fjogeleit/http-request-action@v1
        with:
           url: ${{ secrets.MS_TEAM_HOOK }}
           method: POST
           contentType: 'application/json'
           body: '{"title":"CI/CD SquArtRbNb","text":"Le workflow **${{ github.workflow }}** sur la branche **${{ github.ref_name }}** est terminé.\nStatut : ${{ job.status }}."}'

